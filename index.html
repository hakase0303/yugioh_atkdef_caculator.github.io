<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Status Calculator</title>

    <!-- JSX 파일에서 자주 사용하는 패키지를 브라우저용 주소에 연결합니다. -->
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.3.1",
          "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
          "react-dom": "https://esm.sh/react-dom@18.3.1",
          "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
        }
      }
    </script>

    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>

    <style>
      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
      }

      body {
        font-family: Arial, "Noto Sans KR", sans-serif;
        background: #f8fafc;
      }

      #loading,
      #error {
        box-sizing: border-box;
        max-width: 900px;
        margin: 40px auto;
        padding: 20px;
        border-radius: 12px;
        background: white;
        box-shadow: 0 4px 20px rgb(15 23 42 / 8%);
      }

      #error {
        display: none;
        color: #b91c1c;
        white-space: pre-wrap;
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div id="loading">Status Calculator를 불러오는 중입니다.</div>
    </div>
    <div id="error"></div>

    <script type="module">
      import React from "react";
      import { createRoot } from "react-dom/client";

      const jsxFile = "./StatusCalculator(0829 기준_2).jsx";

      try {
        const response = await fetch(jsxFile);

        if (!response.ok) {
          throw new Error(
            `${jsxFile} 파일을 찾지 못했습니다. index.html과 JSX 파일을 같은 위치에 올렸는지 확인하세요.`,
          );
        }

        const source = await response.text();
        const compiled = Babel.transform(source, {
          filename: "StatusCalculator(0829 기준_2).jsx",
          presets: [["react", { runtime: "automatic" }]],
          sourceType: "module",
        }).code;

        const moduleUrl = URL.createObjectURL(
          new Blob([compiled], { type: "text/javascript" }),
        );

        const module = await import(moduleUrl);
        URL.revokeObjectURL(moduleUrl);

        const StatusCalculator = module.default;

        if (typeof StatusCalculator !== "function") {
          throw new Error(
            "JSX 파일에서 기본 내보내기(export default)된 React 컴포넌트를 찾지 못했습니다.",
          );
        }

        createRoot(document.getElementById("root")).render(
          React.createElement(StatusCalculator),
        );
      } catch (error) {
        document.getElementById("root").style.display = "none";
        const errorBox = document.getElementById("error");
        errorBox.style.display = "block";
        errorBox.textContent = `실행 중 오류가 발생했습니다.\n\n${error.message}`;
        console.error(error);
      }
    </script>
  </body>
</html>
